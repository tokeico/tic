# Runs db + api + web locally (web at http://localhost:8080).
# `api` reads ./tic-api/.env, which is gitignored — `docker compose up` fails
# on a fresh clone until you create it: `cp .env.example .env` in tic-api, then
# `bun run keys` and paste the generated AUDIT_* values in. See tic-api/README.md.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tic}
      POSTGRES_DB: ${POSTGRES_DB:-tic}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./tic-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./tic-api/.env
    environment:
      DATABASE_URL: postgres://tic:tic@db:5432/tic
      WEB_ORIGIN: http://localhost:8080
      PORT: 3000
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./tic-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_ORIGIN: https://geotropic-preseminal-syble.ngrok-free.dev
    ports:
      - "8080:3000"

volumes:
  db-data:
